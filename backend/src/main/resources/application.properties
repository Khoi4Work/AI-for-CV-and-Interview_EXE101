spring.application.name=backend
spring.config.import=classpath:interview-voice.yml
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# AI Configuration - ElevenLabs
spring.ai.elevenlabs.api-key=${ELEVENLABS_API_KEY}
spring.ai.elevenlabs.tts.options.model-id=${ELEVENLABS_MODEL_ID}
spring.ai.elevenlabs.tts.options.voice-id=${ELEVENLABS_VOICE_ID}

# Interview TTS delivery: keep speech bridges and provider-specific emotion tags out of question text.
interview.voice.delivery.enabled=${INTERVIEW_VOICE_DELIVERY_ENABLED:true}
interview.voice.delivery.tagged-model-ids=${ELEVENLABS_TAGGED_MODEL_IDS:eleven_v3,eleven_v4,eleven_v4_turbo}
interview.voice.delivery.tags.behavioral=${INTERVIEW_TTS_BEHAVIORAL_TAG:[curious]}
interview.voice.delivery.tags.situational=${INTERVIEW_TTS_SITUATIONAL_TAG:[thoughtful]}
interview.voice.delivery.tags.hr=${INTERVIEW_TTS_HR_TAG:[curious]}
app.voice-provider=${VOICE_PROVIDER}

# Google AI Studio Configuration
ai.provider=${AI_PROVIDER:groq}
voice.provider=${VOICE_PROVIDER:edge}
spring.ai.google.genai.api-key=${GOOGLE_AI_STUDIO_API_KEY}
spring.ai.google.genai.chat.options.model=${MODEL_CHAT:gemini-2.5-flash}
spring.ai.google.genai.embedding.api-key=${GOOGLE_AI_STUDIO_API_KEY}
spring.ai.google.genai.embedding.text.options.model=${MODEL_EMBEDDING:gemini-embedding-001}

# Cohere Rerank for CV-aware interview question retrieval
cohere.api-key=${COHERE_API_KEY:}
interview.questions.rerank-model=${COHERE_RERANK_MODEL:rerank-v4.0-fast}
interview.questions.minimum-relevance=${INTERVIEW_QUESTION_MIN_RELEVANCE:0.15}
cv.jd-recommendations.rerank-model=${COHERE_RERANK_MODEL:rerank-v4.0-fast}
cv.jd-recommendations.minimum-score=${CV_JD_MINIMUM_RELEVANCE:10}

# Chat providers use named ChatClients so Groq and Gemini can coexist without ambiguous injection.
spring.ai.chat.client.enabled=false
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-20b}
spring.ai.openai.chat.options.response-format.type=JSON_OBJECT

# Vector Store Configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.codec.max-in-memory-size=16777216

# Logging & Error Handling
logging.level.org.apache.pdfbox.pdmodel.font.FileSystemFontProvider=ERROR
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Cloudinary Configuration
cloudinary.url=${CLOUDINARY_URL}

# OAuth2 Google Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GOOGLE_EMAIL}
spring.mail.password=${GOOGLE_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# PayOS Configuration
payos.client.id=${PAYOS_CLIENT_ID}
payos.api.key=${PAYOS_API_KEY}
payos.checksum.key=${PAYOS_CHECKSUM_KEY}

# Unverified email registration cleanup: two days, plus a 24-hour resend grace.
# Set AUTH_PENDING_CLEANUP_DRY_RUN=true to audit candidates without deleting them.
app.auth.pending-cleanup.enabled=${AUTH_PENDING_CLEANUP_ENABLED:true}
app.auth.pending-cleanup.dry-run=${AUTH_PENDING_CLEANUP_DRY_RUN:false}
app.auth.pending-cleanup.retention-days=${AUTH_PENDING_RETENTION_DAYS:2}
app.auth.pending-cleanup.resend-grace-hours=${AUTH_PENDING_RESEND_GRACE_HOURS:24}
app.auth.pending-cleanup.batch-size=${AUTH_PENDING_CLEANUP_BATCH_SIZE:100}
app.auth.pending-cleanup.cron=${AUTH_PENDING_CLEANUP_CRON:0 0 3 * * *}
app.auth.pending-cleanup.zone=${AUTH_PENDING_CLEANUP_ZONE:Asia/Ho_Chi_Minh}

# Public verification links and durable verification-mail delivery.
app.backend.url=${BACKEND_URL:http://localhost:8080}
app.auth.verification.expiry-hours=${AUTH_VERIFICATION_EXPIRY_HOURS:24}
app.auth.verification.mail-poll-ms=${AUTH_VERIFICATION_MAIL_POLL_MS:10000}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
