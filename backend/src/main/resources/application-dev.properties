# Activate with SPRING_PROFILES_ACTIVE=dev.
# These variables must point to a dedicated development database; there is no fallback to DB_URL.
spring.datasource.url=${DEV_DB_URL}
spring.datasource.username=${DEV_DB_USERNAME}
spring.datasource.password=${DEV_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Keep schema changes manual. Run the CV analysis migration against the development database first.
spring.jpa.hibernate.ddl-auto=none
cv.analysis.enabled=${CV_ANALYSIS_ENABLED:true}
cv.jd-metadata.backfill-enabled=${CV_JD_METADATA_BACKFILL_ENABLED:false}

# Make local testing convenient without sending links to a production frontend.
app.frontend.url=${DEV_FRONTEND_URL:http://localhost:5173}
app.backend.url=${DEV_BACKEND_URL:http://localhost:8080}

# Avoid verbose SQL by default; enable with HIBERNATE_SQL_LOG_LEVEL=DEBUG when needed.
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
