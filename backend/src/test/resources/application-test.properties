spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.elevenlabs.api-key=test-elevenlabs-key
spring.ai.elevenlabs.tts.options.model-id=test-model
spring.ai.elevenlabs.tts.options.voice-id=test-voice
app.voice-provider=edge
spring.ai.google.genai.api-key=test-google-ai-key
spring.ai.google.genai.embedding.api-key=test-google-ai-key
cloudinary.url=cloudinary://test:test@test
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.flyway.locations=classpath:db/migration
