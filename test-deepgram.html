<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Deepgram Diagnostic Tool</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background: #f4f7f9; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #0b3c8f; text-align: center; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        input { padding: 12px; width: 60%; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        button { padding: 15px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: all 0.2s; color: white; }
        .btn-min { background: #6c757d; }
        .btn-std { background: #17a2b8; }
        .btn-full { background: #0b3c8f; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }
        #log { background: #1e1e1e; color: #d4d4d4; padding: 15px; height: 400px; overflow-y: auto; border-radius: 8px; font-family: 'Consolas', monospace; font-size: 13px; line-height: 1.5; }
        .success { color: #4ec9b0; font-weight: bold; }
        .error { color: #f44747; font-weight: bold; }
        .info { color: #9cdcfe; }
        .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 5px; background: #444; color: #eee; }
    </style>
</head>
<body>
<div class="container">
    <h1>Deepgram Diagnostic Tool 🩺</h1>
    <p style="text-align: center; color: #666;">Công cụ này giúp xác định chính xác nguyên nhân gây lỗi kết nối 1006</p>

    <div class="input-group">
        <input type="text" id="apiKey" placeholder="Nhập Deepgram API Key vào đây...">
    </div>

    <div class="btn-group">
        <button class="btn-min" onclick="test('minimal')">1. Test Tối Giản<br>(Nova-2, English)</button>
        <button class="btn-std" onclick="test('standard')">2. Test Nova<br>(Nova-2, Vietnamese)</button>
        <button class="btn-full" onclick="test('full')">3. Test Full App<br>(Nova-2, Vietnamese + Smart Format)</button>
    </div>

    <div id="log"></div>
</div>

<script>
    const logDiv = document.getElementById('log');
    function log(msg, type = 'info') {
        const div = document.createElement('div');
        div.className = type;
        div.innerHTML = `<span class="tag">${new Date().toLocaleTimeString()}</span> ${msg}`;
        logDiv.appendChild(div);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Đã sửa đổi: Chuyển toàn bộ sang giao thức wss:// và sử dụng model nova-2 mới nhất
    const CONFIGS = {
        minimal: {
            name: "TỐI GIẢN",
            url: () => `wss://api.deepgram.com/v1/listen?model=nova-2&language=en`
        },
        standard: {
            name: "NOVA STANDARD",
            url: () => `wss://api.deepgram.com/v1/listen?model=nova-2&language=vi`
        },
        full: {
            name: "FULL APP CONFIG",
            url: () => `wss://api.deepgram.com/v1/listen?model=nova-2&language=vi&smart_format=true&encoding=linear16&sample_rate=16000`
        }
    };

    async function test(mode) {
        const key = document.getElementById('apiKey').value.trim();
        if (!key) {
            alert('Vui lòng nhập API Key');
            return;
        }

        const config = CONFIGS[mode];
        log(`--- Bắt đầu thử nghiệm: ${config.name} ---`, 'info');
        log(`URL: ${config.url()}`);

        try {
            // SỬA ĐỔI QUAN TRỌNG: Truyền token qua sub-protocol mảng ['token', key]
            // Đây là cách duy nhất để truyền Auth Header cho WebSocket trên Browser Front-end
            const socket = new WebSocket(config.url(), ['token', key]);

            socket.onopen = () => {
                log(`KẾT NỐI THÀNH CÔNG! ✅`, 'success');
                log(`Chúc mừng! API Key hợp lệ và Server Deepgram chấp nhận cấu hình ${config.name}.`);

                // Gửi một tin nhắn giữ băng thông (KeepAlive) để tránh bị sập do timeout ngay lập tức
                socket.send(JSON.stringify({ type: "KeepAlive" }));

                // Để kết nối mở trong 2.5 giây cho bạn quan sát rồi tự đóng đẹp đẽ
                setTimeout(() => {
                    log(`Đang chủ động đóng kết nối thử nghiệm...`);
                    socket.close(1000);
                }, 2500);
            };

            socket.onerror = (err) => {
                log(`LỖI KẾT NỐI SƠ BỘ! ❌`, 'error');
                log(`Chi tiết: Browser chặn thông tin lỗi chi tiết vì lý do bảo mật. Hãy xem mã lỗi đóng phía dưới.`);
            };

            socket.onclose = (event) => {
                if (event.code !== 1000) {
                    log(`KẾT NỐI BỊ ĐÓNG ĐỘT NGỘT! ❌`, 'error');
                    log(`Mã lỗi trả về từ Server: ${event.code} | Lý do: ${event.reason || 'Không có lý do'}`);

                    // Phân tích mã lỗi chuẩn của WebSocket
                    if (event.code === 1006) {
                        log(`Phân tích: Lỗi 1006 (Abnormal Closure). Do bạn đổi sang wss nhưng API Key nhập vào vẫn SAI, hoặc tài khoản hết hạn/bị chặn nên server từ chối bắt tay.`, 'error');
                    } else if (event.code === 4001) {
                        log(`Phân tích: Lỗi 4001 (Unauthorized). Chắc chắn API Key của bạn chưa đúng hoặc không có quyền truy cập.`, 'error');
                    }
                } else {
                    log(`Kết nối đóng bình thường hoàn toàn (Mã 1000). 🎉`, 'success');
                }
            };

        } catch (e) {
            log(`Lỗi ngoại lệ (Exception): ${e.message}`, 'error');
        }
    }
</script>
</body>
</html>
